---
- name: Setari de baza pentru toate serverele
  hosts: all
  become: yes  # Ruleaza comenzile cu sudo
  roles:
    - common

- name: Configurare DB Master
  hosts: db_master
  become: yes
  roles:
    - db_master

- name: Configurare DB Slave
  hosts: db_slave
  become: yes
  roles:
    - db_slave

# --- NOU: Oprim simulatorul de pe Bastion (localhost) pentru a evita conflictele de date ---
- name: Pauza Generator Date
  hosts: localhost
  become: yes
  tasks:
    - name: Opreste temporar Festo Simulator
      systemd:
        name: festo_simulator
        state: stopped
      ignore_errors: yes

- name: Configurare Baza de Date Aplicatie (Post-Replicare)
  hosts: db_master
  become: yes
  vars:
    db_name: "industrial_db"
  tasks:
    - name: Create application database
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create festo_telemetry table
      mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_db: "{{ db_name }}"
        query: >
          CREATE TABLE IF NOT EXISTS festo_telemetry (
            id INT AUTO_INCREMENT PRIMARY KEY,
            timestamp DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
            station_name VARCHAR(50) NOT NULL,
            payload_json JSON NOT NULL,
            INDEX idx_station (station_name),
            INDEX idx_timestamp (timestamp)
          )

    - name: Check whether maintenance command table exists
      mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_db: "{{ db_name }}"
        query: >
          SELECT COUNT(*) AS table_count
          FROM information_schema.tables
          WHERE table_schema = '{{ db_name }}'
            AND table_name = 'maintenance_commands'
      register: maintenance_table_check
      changed_when: false
      tags:
        - maintenance

    - name: Create maintenance command and audit table
      mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_db: "{{ db_name }}"
        query: >
          CREATE TABLE IF NOT EXISTS maintenance_commands (
            id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,
            created_at DATETIME(3) NOT NULL DEFAULT CURRENT_TIMESTAMP(3),
            station_name VARCHAR(64) NOT NULL,
            action_type VARCHAR(32) NOT NULL,
            component VARCHAR(64) NOT NULL DEFAULT 'station',
            status VARCHAR(16) NOT NULL DEFAULT 'PENDING',
            requested_by VARCHAR(64) NOT NULL DEFAULT 'dashboard',
            notes VARCHAR(500) NOT NULL DEFAULT '',
            parameters_json JSON NULL,
            applied_at DATETIME(3) NULL,
            result_json JSON NULL,
            INDEX idx_maintenance_status (status, id),
            INDEX idx_maintenance_station_time (station_name, created_at)
          )
      when: maintenance_table_check.query_result[0][0].table_count | int == 0
      tags:
        - maintenance

    # --- Permisiuni diferentiate pe Master (Read/Write) ---
- name: Configurare Useri de Aplicatie (Master)
  hosts: db_master
  become: yes
  vars:
    db_name: "industrial_db"
  tasks:
    - name: Create database user for writing (Simulator)
      mysql_user:
        name: "sensor_app"
        password: "SenzorPass123!"
        priv: "{{ db_name }}.festo_telemetry:INSERT,SELECT"
        host: "%"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Grant simulator least-privilege access from controller host
      mysql_user:
        name: "sensor_app"
        password: "SenzorPass123!"
        priv: "{{ db_name }}.festo_telemetry:INSERT,SELECT/{{ db_name }}.maintenance_commands:SELECT,UPDATE"
        host: "{{ hostvars['localhost']['ansible_default_ipv4']['address'] }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true
      tags:
        - maintenance

    - name: Grant dashboard command access from web server
      mysql_user:
        name: "sensor_app"
        password: "SenzorPass123!"
        priv: "{{ db_name }}.maintenance_commands:INSERT,SELECT"
        host: "{{ hostvars[groups['web_servers'][0]]['ansible_host'] | default(groups['web_servers'][0]) }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true
      tags:
        - maintenance

# --- Permisiuni diferentiate pe Slave (Read-Only) ---
- name: Configurare Useri de Aplicatie (Slave)
  hosts: db_slave
  become: yes
  vars:
    db_name: "industrial_db"
  tasks:
    - name: Create database user for reading (Web API)
      mysql_user:
        name: "sensor_app"
        password: "SenzorPass123!"
        priv: "{{ db_name }}.festo_telemetry:SELECT"
        host: "%"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Grant dashboard read-only access from web server
      mysql_user:
        name: "sensor_app"
        password: "SenzorPass123!"
        priv: "{{ db_name }}.festo_telemetry:SELECT/{{ db_name }}.maintenance_commands:SELECT"
        host: "{{ hostvars[groups['web_servers'][0]]['ansible_host'] | default(groups['web_servers'][0]) }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true
      tags:
        - maintenance

# --- NOU: Repornim simulatorul acum ca structura bazei de date e gata pe ambele servere ---
- name: Start Generator Date
  hosts: localhost
  become: yes
  tasks:
    - name: Porneste Festo Simulator
      systemd:
        name: festo_simulator
        state: started

# L-am mutat la final: Web serverul se instalează doar după ce backend-ul (bazele de date) e 100% gata
- name: Configurare Web Server
  hosts: web_servers
  become: yes
  roles:
    - web
