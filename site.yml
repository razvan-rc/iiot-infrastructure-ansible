---
- name: Setari de baza pentru toate serverele
  hosts: all
  become: yes  # Ruleaza comenzile cu sudo
  roles:
    - common

- name: Configurare DB Master
  hosts: db_master
  become: yes
  roles:
    - db_master

- name: Configurare DB Slave
  hosts: db_slave
  become: yes
  roles:
    - db_slave

# --- NOU: Oprim simulatorul de pe Bastion (localhost) pentru a evita conflictele de date ---
- name: Pauza Generator Date
  hosts: localhost
  become: yes
  tasks:
    - name: Opreste temporar Festo Simulator
      systemd:
        name: festo_simulator
        state: stopped
      ignore_errors: yes

- name: Configurare Baza de Date Aplicatie (Post-Replicare)
  hosts: db_master
  become: yes
  vars:
    db_name: "industrial_db"
  tasks:
    - name: Create application database
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create festo_telemetry table
      mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_db: "{{ db_name }}"
        query: >
          CREATE TABLE IF NOT EXISTS festo_telemetry (
            id INT AUTO_INCREMENT PRIMARY KEY,
            timestamp DATETIME(3) DEFAULT CURRENT_TIMESTAMP(3),
            station_name VARCHAR(50) NOT NULL,
            payload_json JSON NOT NULL,
            INDEX idx_station (station_name),
            INDEX idx_timestamp (timestamp)
          )

    # --- Permisiuni diferentiate pe Master (Read/Write) ---
- name: Configurare Useri de Aplicatie (Master)
  hosts: db_master
  become: yes
  vars:
    db_name: "industrial_db"
  tasks:
    - name: Create database user for writing (Simulator)
      mysql_user:
        name: "sensor_app"
        password: "SenzorPass123!"
        priv: "{{ db_name }}.festo_telemetry:INSERT,SELECT"
        host: "%"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

# --- Permisiuni diferentiate pe Slave (Read-Only) ---
- name: Configurare Useri de Aplicatie (Slave)
  hosts: db_slave
  become: yes
  vars:
    db_name: "industrial_db"
  tasks:
    - name: Create database user for reading (Web API)
      mysql_user:
        name: "sensor_app"
        password: "SenzorPass123!"
        priv: "{{ db_name }}.festo_telemetry:SELECT"
        host: "%"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

# --- NOU: Repornim simulatorul acum ca structura bazei de date e gata pe ambele servere ---
- name: Start Generator Date
  hosts: localhost
  become: yes
  tasks:
    - name: Porneste Festo Simulator
      systemd:
        name: festo_simulator
        state: started

# L-am mutat la final: Web serverul se instalează doar după ce backend-ul (bazele de date) e 100% gata
- name: Configurare Web Server
  hosts: web_servers
  become: yes
  roles:
    - web
