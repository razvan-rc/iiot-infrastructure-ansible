---
- name: Setari de baza pentru toate serverele
  hosts: all
  become: yes  # Ruleaza comenzile cu sudo
  roles:
    - common

- name: Configurare DB Master
  hosts: db_master
  become: yes
  roles:
    - db_master

- name: Configurare DB Slave
  hosts: db_slave
  become: yes
  roles:
    - db_slave

# --- NOU: Oprim simulatorul de pe Bastion (localhost) pentru a evita conflictele de date ---
- name: Pauza Generator Date
  hosts: localhost
  become: yes
  tasks:
    - name: Opreste temporar Festo Simulator
      systemd:
        name: festo_simulator
        state: stopped
      ignore_errors: yes

- name: Configurare Baza de Date Aplicatie (Post-Replicare)
  hosts: db_master
  become: yes
  vars:
    db_name: "industrial_db"
  tasks:
    - name: Create application database
      mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create festo_telemetry table
      mysql_query:
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_db: "{{ db_name }}"
        query: >
          CREATE TABLE IF NOT EXISTS festo_telemetry (
              id INT AUTO_INCREMENT PRIMARY KEY,
              timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              container_id VARCHAR(50),
              station_name VARCHAR(50),
              container_color VARCHAR(20),
              air_pressure_bar FLOAT,
              status VARCHAR(20)
          )

    - name: Create database user for the Python sensor script
      mysql_user:
        name: "sensor_app"
        password: "SenzorPass123!"
        priv: "{{ db_name }}.festo_telemetry:INSERT,SELECT"
        host: "%"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

# --- NOU: Repornim simulatorul acum ca structura bazei de date e gata pe ambele servere ---
- name: Start Generator Date
  hosts: localhost
  become: yes
  tasks:
    - name: Porneste Festo Simulator
      systemd:
        name: festo_simulator
        state: started

# L-am mutat la final: Web serverul se instalează doar după ce backend-ul (bazele de date) e 100% gata
- name: Configurare Web Server
  hosts: web_servers
  become: yes
  roles:
    - web
