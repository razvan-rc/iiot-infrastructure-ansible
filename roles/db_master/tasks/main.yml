---
- name: Instalare pachet MariaDB Server
  apt:
    name: mariadb-server
    state: present

- name: Ensure /var/log/mysql directory exists for binary logs
  file:
    path: /var/log/mysql
    state: directory
    owner: mysql
    group: mysql
    mode: '0755'

- name: Adaugare configuratie de Master pentru replicare
  template:
    src: 99-replication.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-replication.cnf
  notify: Restart MariaDB

- name: Asigurare ca serviciul MariaDB este pornit
  service:
    name: mariadb
    state: started
    enabled: yes

- name: Creare baza de date ({{ db_name }})
  mysql_db:
    name: "{{ db_name }}"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

- name: Creare user pentru replicare
  mysql_user:
    name: "{{ repl_user }}"
    password: "{{ repl_password }}"
    priv: "*.*:REPLICATION SLAVE"
    host: "%"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock

# Create the new schema for the Festo MPS telemetry
- name: Create festo_telemetry table
  mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: "{{ db_name }}"
    query: >
      CREATE TABLE IF NOT EXISTS festo_telemetry (
          id INT AUTO_INCREMENT PRIMARY KEY,
          timestamp TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
          container_id VARCHAR(50),
          station_name VARCHAR(50),
          container_color VARCHAR(20),
          air_pressure_bar FLOAT,
          status VARCHAR(20)
      )

# Create the dedicated user for the Python simulator script
- name: Create database user for the Python sensor script
  mysql_user:
    name: "sensor_app"
    password: "SenzorPass123!"
    priv: "{{ db_name }}.festo_telemetry:INSERT,SELECT"
    host: "%"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
