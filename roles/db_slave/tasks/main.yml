---
# Install the MariaDB Server package
- name: Install MariaDB Server
  apt:
    name: mariadb-server
    state: present

# Apply the slave-specific configuration file
- name: Configure Slave settings
  template:
    src: 99-replication.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/99-replication.cnf
  notify: Restart MariaDB

# Ensure the database service is running before setting up replication
- name: Ensure MariaDB is started
  service:
    name: mariadb
    state: started
    enabled: yes

- name: Ensure /var/log/mysql directory exists for relay logs
  file:
    path: /var/log/mysql
    state: directory
    owner: mysql
    group: mysql
    mode: '0755'

- name: Verifica statusul replicarii
  mysql_info:
    filter: slave_status
    login_unix_socket: /var/run/mysqld/mysqld.sock
  register: replica_status

- name: Verifica statusul replicarii (Shell brut)
  command: mysql -e "SHOW SLAVE STATUS\G"
  register: replica_status_raw
  changed_when: false
  ignore_errors: true

# Fortam oprirea proceselor de replicare inainte sa rescriem setarile
- name: Opreste slave-ul inainte de reconfigurare
  mysql_replication:
    mode: stopreplica
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: "'Slave_IO_Running: Yes' not in replica_status_raw.stdout"

# Dynamically fetch the Master's IP and configure the replication link
- name: Setup replication connection (CHANGE MASTER TO)
  mysql_replication:
    mode: changeprimary
    master_host: "{{ hostvars[groups['db_master'][0]]['ansible_host'] | default(groups['db_master'][0]) }}"
    master_user: "{{ repl_user }}"
    master_password: "{{ repl_password }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: "'Slave_IO_Running: Yes' not in replica_status_raw.stdout"

# Start the slave thread to begin syncing data from the Master
- name: Start slave thread
  mysql_replication:
    mode: startreplica
    login_unix_socket: /var/run/mysqld/mysqld.sock
  when: "'Slave_IO_Running: Yes' not in replica_status_raw.stdout"
