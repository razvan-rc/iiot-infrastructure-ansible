---
# Install required packages for hosting a Python web application
- name: Install Nginx, Git, and Python environments
  apt:
    name:
      - nginx
      - git
      - python3-pip
      - python3-venv
    state: present
    update_cache: yes

# Ensure the Nginx web server is running and enabled on system boot
- name: Ensure Nginx is started
  service:
    name: nginx
    state: started
    enabled: yes

- name: Creare director aplicatie Web
  ansible.builtin.file:
    path: /var/www/industrial_app
    state: directory
    owner: ubuntu
    group: www-data
    mode: '0775'
  become: yes

- name: Clonare repository aplicatie Web
  git:
    repo: 'https://oauth2:{{ github_token }}@github.com/razvan-rc/iiot-web-app.git'
    dest: /var/www/industrial_app
    version: main
    force: yes
    accept_hostkey: yes
  become: yes
  become_user: ubuntu
  no_log: true
  notify: Restart IIoT web service

- name: Instalare dependente Python in venv
  pip:
    requirements: /var/www/industrial_app/requirements.txt
    virtualenv: /var/www/industrial_app/venv
    virtualenv_command: python3 -m venv

- name: Instalare Gunicorn in venv
  pip:
    name: gunicorn
    virtualenv: /var/www/industrial_app/venv

- name: Configurare serviciu systemd pentru Gunicorn
  copy:
    dest: /etc/systemd/system/iiot-web.service
    content: |
      [Unit]
      Description=Gunicorn instance to serve IIoT Festo Dashboard
      After=network.target

      [Service]
      User=ubuntu
      Group=www-data
      WorkingDirectory=/var/www/industrial_app
      Environment="PATH=/var/www/industrial_app/venv/bin"
      ExecStart=/var/www/industrial_app/venv/bin/gunicorn --workers 3 --bind 127.0.0.1:5000 app:app

      [Install]
      WantedBy=multi-user.target
  notify: Restart IIoT web service

- name: Validate maintenance control token
  ansible.builtin.assert:
    that:
      - maintenance_control_token is defined
      - maintenance_control_token | length >= 32
      - maintenance_control_token | length <= 128
      - maintenance_control_token is match('^[A-Za-z0-9_-]+$')
    fail_msg: "maintenance_control_token must contain 32-128 URL-safe characters"
  no_log: true
  tags:
    - maintenance

- name: Create systemd drop-in directory for IIoT web service
  ansible.builtin.file:
    path: /etc/systemd/system/iiot-web.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - maintenance

- name: Configure maintenance API and database endpoints
  ansible.builtin.template:
    src: maintenance-control.conf.j2
    dest: /etc/systemd/system/iiot-web.service.d/maintenance-control.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart IIoT web service
  no_log: true
  tags:
    - maintenance

- name: Configurare Nginx Reverse Proxy
  copy:
    dest: /etc/nginx/sites-available/iiot-web
    content: |
      server {
          listen 80;
          server_name _;
          location / {
              proxy_pass http://127.0.0.1:5000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }

- name: Activare site Nginx si stergere default
  file:
    src: /etc/nginx/sites-available/iiot-web
    dest: /etc/nginx/sites-enabled/iiot-web
    state: link

- name: Stergere configurare Nginx default
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Ensure Gunicorn service is started and enabled
  systemd:
    name: iiot-web
    state: started
    daemon_reload: yes
    enabled: yes
  tags:
    - maintenance

- name: Restart Nginx pentru a aplica setarile
  systemd:
    name: nginx
    state: restarted
